<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171009">
    <meta name="description" content="Adrian Sizemore — engineering, service, community, golf, surf fishing, and Orioles baseball.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://adriansizemore.net/">
    <meta property="og:title" content="Adrian Sizemore">
    <meta property="og:description" content="Engineering, service, community, and time outdoors.">
    <meta property="og:image" content="https://adriansizemore.net/assets/og.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Adrian Sizemore">
    <meta name="twitter:description" content="Engineering, service, community, and time outdoors.">
    <meta name="twitter:image" content="https://adriansizemore.net/assets/og.webp">
    <link rel="preload" as="image" href="assets/golf-surf-hero-augusta.webp" fetchpriority="high">
    <link rel="stylesheet" href="styles.css?v=augusta">
    <title>Adrian Sizemore</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <p class="site-name">Adrian Sizemore</p>
        <a class="learn-more" href="https://about.adriansizemore.net/" aria-label="Learn more about Adrian Sizemore">
          Learn More <span aria-hidden="true">↗</span>
        </a>
      </header>

      <main>
        <section class="hero" aria-labelledby="welcome-title">
          <div class="hero-shade" aria-hidden="true"></div>
          <div class="hero-copy">
            <h1 id="welcome-title">Welcome.</h1>
            <div class="ornament" aria-hidden="true"><span></span><i>◆</i><span></span></div>
            <p>Engineering, service, community, and time outdoors.</p>
          </div>
        </section>

        <section class="chapters" aria-label="A few parts of Adrian's life">
          <article class="chapter career">
            <h2>Career</h2>
            <div class="heading-rule" aria-hidden="true"><span></span><i></i><span></span></div>
            <div class="career-content">
              <div class="ccie-lockup">
                <img src="assets/ccie-51766.png" width="210" height="210" alt="Cisco Certified Internetwork Expert, CCIE number 51766">
              </div>

              <div class="company">
                <img class="metlife-logo" src="assets/metlife.svg" alt="MetLife">
                <p>MetLife <span>·</span> 2017–Present</p>
              </div>

              <div class="company">
                <img class="verizon-logo" src="assets/verizon.svg" alt="Verizon">
                <p>Verizon <span>·</span> 2005–2017</p>
              </div>
            </div>
          </article>

          <article class="chapter service">
            <h2>Service</h2>
            <div class="heading-rule" aria-hidden="true"><span></span><i></i><span></span></div>
            <div class="service-list">
              <div class="service-item">
                <img src="assets/marine-corps-emblem.png" width="146" height="146" alt="United States Marine Corps emblem">
                <p>U.S. Marine Corps <span>·</span> 1992–1996</p>
              </div>
              <div class="service-item">
                <img src="assets/navy-emblem.png" width="146" height="146" alt="United States Navy emblem">
                <p>U.S. Navy <span>·</span> 1999–2003</p>
              </div>
            </div>
          </article>

          <article class="chapter community">
            <h2>Community</h2>
            <div class="heading-rule" aria-hidden="true"><span></span><i></i><span></span></div>
            <div class="community-content">
              <span class="service-star" aria-hidden="true">★</span>
              <p class="post-name">Franklin–Sloan<br>VFW Post 7383</p>
              <div class="leather-nameplate" aria-hidden="true"><span>◆</span></div>
              <p class="location">Cary, North Carolina</p>
              <span class="service-star lower" aria-hidden="true">★</span>
            </div>
          </article>

          <article class="chapter orioles">
            <h2>Orioles</h2>
            <div class="heading-rule" aria-hidden="true"><span></span><i></i><span></span></div>
            <div class="orioles-photo" role="img" aria-label="Oriole Park at Camden Yards at sunset">
              <img class="orioles-logo" src="assets/orioles.svg" alt="Baltimore Orioles">
            </div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
