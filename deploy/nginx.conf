server {
    listen 80;
    listen [::]:80;
    server_name about.adriansizemore.net;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1 {
        return 308 /api/v1/;
    }

    # This public proxy exposes only the read-only endpoints used by React.
    # BACKEND_ORIGIN is substituted by the nginx container entrypoint.
    location ~ ^/api/v1/(about|experience|military-service|resume|projects|volunteering|education|certifications|skills)/$ {
        limit_except GET {
            deny all;
        }

        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Administrator login requires password + authenticator code. The backend
    # issues short-lived, MFA-marked tokens and rate-limits this endpoint.
    location ~ ^/api/v1/admin/token(?:/refresh)?/$ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/contact/config/ {
        limit_except GET { deny all; }
        proxy_pass ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/contact/ {
        limit_except POST { deny all; }
        client_max_body_size 32k;
        proxy_pass ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/v1/studio/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Do not turn the EC2 instance into a general-purpose backend proxy.
    location /api/ {
        return 404;
    }

    # The portal stays private on the lab VM. EC2 is its only Tailscale client.
    location ~ ^/(labrequest|verify|reveal)(/|$) {
        proxy_pass https://100.76.5.32;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name networking-lab.tailf2eaa0.ts.net;
        proxy_set_header Host resume.adriansizemore.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location = /static/portal.css {
        proxy_pass https://100.76.5.32;
        proxy_ssl_server_name on;
        proxy_ssl_name networking-lab.tailf2eaa0.ts.net;
        proxy_set_header Host resume.adriansizemore.net;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        proxy_pass https://100.76.5.32;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name networking-lab.tailf2eaa0.ts.net;
        proxy_set_header Host resume.adriansizemore.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name resume.adriansizemore.net;

    return 301 https://about.adriansizemore.net$request_uri;
}
